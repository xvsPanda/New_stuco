<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NN Council Admin</title>
<meta name="description" content="NN Student Council member administration">
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1c1917;background:#f8f5f1;--orange:#eb5b18;--navy:#17233e;--line:#e5ded6;--muted:#756d65;--white:#fff;--soft:#fff0e7;--red:#b52f2f}*{box-sizing:border-box}body{margin:0;min-height:100vh}.shell{width:min(1100px,calc(100% - 36px));margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px 0;border-bottom:1px solid var(--line)}.brand{font-weight:800;letter-spacing:-.03em}.brand span{display:inline-grid;place-items:center;width:34px;height:34px;margin-right:9px;border-radius:10px 10px 10px 3px;background:var(--orange);color:#fff}.top-actions{display:flex;align-items:center;gap:9px}.user-badge{padding:8px 12px;border-radius:999px;background:var(--soft);color:#a9400e;font-size:.82rem;font-weight:700}.top button,.btn{border:1px solid var(--line);border-radius:999px;background:#fff;padding:10px 15px;font:inherit;font-weight:700;cursor:pointer}.top button:hover,.btn:hover{border-color:var(--orange);color:var(--orange)}main{padding:42px 0 80px}.intro{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:26px}.eyebrow{color:var(--orange);font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.12em}h1{margin:8px 0;font-family:Georgia,serif;font-size:clamp(2.2rem,5vw,3.7rem);letter-spacing:-.05em;line-height:1}h2{margin:0;font-size:1.15rem}p{color:var(--muted)}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}.tab{padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--muted);font:inherit;font-weight:700;cursor:pointer}.tab.active,.tab:hover{border-color:var(--navy);background:var(--navy);color:#fff}.panel{padding:24px;border:1px solid var(--line);border-radius:18px;background:var(--white);box-shadow:0 12px 35px #4b372414}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.toolbar-actions{display:flex;gap:8px;flex-wrap:wrap}.primary{background:var(--navy);color:#fff;border-color:var(--navy)}.primary:hover{background:var(--orange);color:#fff}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:650px}.table th{text-align:left;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em}.table th,.table td{padding:14px 10px;border-bottom:1px solid var(--line);vertical-align:middle}.table td:first-child,.table th:first-child{padding-left:0}.table td:last-child,.table th:last-child{padding-right:0;text-align:right}.member-name{font-weight:800}.member-meta{display:block;color:var(--muted);font-size:.82rem;margin-top:2px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--soft);color:#a9400e;font-size:.78rem;font-weight:700}.actions{display:flex;justify-content:flex-end;gap:6px}.small{padding:7px 11px;font-size:.84rem}.danger:hover{border-color:var(--red);color:var(--red)}.login{width:min(430px,100%);margin:12vh auto}.login .panel{padding:30px}.login h1{font-size:2.45rem}.field{display:grid;gap:7px;margin:15px 0}.field label{font-size:.83rem;font-weight:800}.field input,.field textarea,.field select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#1c1917;font:inherit}.field textarea{min-height:95px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{outline:3px solid #eb5b1825;border-color:var(--orange)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.full{grid-column:1/-1}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:24px}.modal{position:fixed;inset:0;display:none;place-items:center;padding:20px;background:#18120ecc;z-index:3}.modal.open{display:grid}.modal-card{width:min(630px,100%);max-height:90vh;overflow:auto;padding:27px;border-radius:18px;background:#fff}.modal-card h2{margin:0 0 20px;font-family:Georgia,serif;font-size:1.65rem}.notice{min-height:22px;margin:10px 0;color:var(--red);font-size:.88rem}.muted{color:var(--muted);font-size:.86rem}.empty{text-align:center;padding:35px;color:var(--muted)}.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.stat{padding:18px;border:1px solid var(--line);border-radius:14px;background:#fff}.stat strong{display:block;font:700 1.8rem Georgia,serif}.stat span{color:var(--muted);font-size:.83rem}.log-action{font-weight:700}.success{color:#2e785b}.warning{padding:13px 15px;margin-bottom:18px;border-radius:12px;background:#fff7d8;color:#735800;font-size:.86rem}.check{display:flex;align-items:center;gap:8px;margin:9px 0;font-size:.88rem}.check input{accent-color:var(--orange)}@media(max-width:700px){.intro{display:block}.intro .btn{margin-top:12px}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.modal-card{padding:20px}.stat-grid{grid-template-columns:1fr}.user-badge{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<div class="modal" id="editor" role="dialog" aria-modal="true" aria-labelledby="editorTitle"><div class="modal-card"><h2 id="editorTitle">Add member</h2><form id="memberForm"><input type="hidden" id="memberId"><div class="form-grid"><div class="field"><label for="name">Name</label><input id="name" required placeholder="e.g. Munkhenerel"></div><div class="field"><label for="role">Role</label><input id="role" required value="Class Representative"></div><div class="field"><label for="cls">Class</label><input id="cls" required pattern="[0-9]{1,2}[A-Za-z]" placeholder="10A"></div><div class="field"><label for="type">Type</label><select id="type"><option value="representative">Representative</option><option value="leadership">Leadership</option></select></div><div class="field full"><label for="email">Email (optional)</label><input id="email" type="email" placeholder="name@student.naran.edu.mn"></div><div class="field full"><label for="jobs">Responsibilities</label><input id="jobs" placeholder="Student voice, Events, Class leadership"></div><div class="field full"><label for="bio">About</label><textarea id="bio" required placeholder="What does this person do?"></textarea></div></div><div class="notice" id="formNotice" role="alert"></div><div class="form-actions"><button class="btn" type="button" id="cancel">Cancel</button><button class="btn primary" type="submit">Save member</button></div></form></div></div>
<div class="modal" id="userEditor" role="dialog" aria-modal="true" aria-labelledby="userEditorTitle"><div class="modal-card"><h2 id="userEditorTitle">Add user</h2><form id="userForm"><input type="hidden" id="userId"><div class="field"><label for="userName">Name</label><input id="userName" required placeholder="Council administrator"></div><div class="field"><label for="userLogin">Username</label><input id="userLogin" required autocomplete="username"></div><div class="field"><label for="userRole">Role</label><select id="userRole"><option value="admin">Admin — manage members and backups</option><option value="editor">Editor — edit members and export</option><option value="viewer">Viewer — view and export only</option><option value="owner">Owner — full access</option></select></div><div class="field"><label for="userPassword">Password <span class="muted">(required for new users)</span></label><input id="userPassword" type="password" autocomplete="new-password" minlength="6"></div><div class="notice" id="userNotice" role="alert"></div><div class="form-actions"><button class="btn" type="button" id="userCancel">Cancel</button><button class="btn primary" type="submit">Save user</button></div></form></div></div>
<script>
const KEY={members:'nn-members',users:'nn-users',audit:'nn-audit',backups:'nn-backups',session:'nn-admin-session'};
const ROLES={owner:{label:'Owner',permissions:['members.view','members.edit','members.delete','users.manage','backups.manage','audit.view']},admin:{label:'Admin',permissions:['members.view','members.edit','members.delete','backups.manage','audit.view']},editor:{label:'Editor',permissions:['members.view','members.edit','backups.manage']},viewer:{label:'Viewer',permissions:['members.view','backups.export']}};
const DEFAULT_MEMBERS=[
{id:'munkhenerel',name:'Munkhenerel',role:'President',cls:'12B',type:'leadership',photo:null,jobs:['Leadership','Strategic planning','Student advocacy','Council management'],bio:'Leads the council and speaks for students on campus life, working to make Nomt Naran a place where every student is heard.',email:'munkhenerel@student.naran.edu.mn'},
{id:'misheel',name:'Misheel',role:'Vice President',cls:'11A',type:'leadership',photo:null,jobs:['Operations','Event coordination','Team support'],bio:'Supports the president and runs day-to-day council operations, from planning events to keeping members connected.',email:'misheel@student.naran.edu.mn'},
{id:'bilguun',name:'Bilguun',role:'Secretary',cls:'12B',type:'leadership',photo:null,jobs:['Documentation','Communications','Record keeping'],bio:"Keeps the council's records and announcements so students can see what was decided and why.",email:'bilguun@student.naran.edu.mn'},
...['10B','11B','12A','10A','10A','11A','12B'].map((cls,i)=>({id:`rep-${i}`,name:['Tselmuun','Emuujin','Goomaral','Enguun','Chinhuslen','',''][i],role:'Class Representative',cls,type:'representative',photo:null,jobs:['Class leadership','Student voice','Events'],bio:`Represents Grade ${cls} students on the council and passes their concerns and ideas to the leadership team.`,email:''}))];
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const read=(key,fallback)=>{try{const v=JSON.parse(localStorage.getItem(key));return v??fallback}catch{return fallback}};const write=(key,value)=>localStorage.setItem(key,JSON.stringify(value));
const uid=()=>crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`;
async function hash(value){if(window.crypto?.subtle){const bytes=new TextEncoder().encode(value),digest=await crypto.subtle.digest('SHA-256',bytes);return [...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,'0')).join('')}return btoa(unescape(encodeURIComponent(value)))}
function currentUser(){const id=sessionStorage.getItem(KEY.session);return read(KEY.users,[]).find(u=>u.id===id)||null}function can(permission){const u=currentUser();return !!u&&ROLES[u.role]?.permissions.includes(permission)}
function audit(action,target,detail=''){const u=currentUser();const logs=read(KEY.audit,[]);logs.unshift({id:uid(),at:new Date().toISOString(),actor:u?.name||'System',actorRole:u?.role||'system',action,target,detail});write(KEY.audit,logs.slice(0,500));}
function backup(reason='Automatic snapshot'){const snapshot={version:1,createdAt:new Date().toISOString(),reason,members:read(KEY.members,DEFAULT_MEMBERS)};const list=read(KEY.backups,[]);const last=list[0];if(last&&Date.now()-new Date(last.createdAt).getTime()<86400000&&reason==='Automatic snapshot')return;list.unshift(snapshot);write(KEY.backups,list.slice(0,30));}
function download(filename,content,type='application/json'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportJSON(){download(`nn-council-members-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify({exportedAt:new Date().toISOString(),members:read(KEY.members,DEFAULT_MEMBERS)},null,2));audit('export','members','JSON export')}
function exportCSV(){const rows=[['Name','Role','Class','Type','Email','Responsibilities','About'],...read(KEY.members,DEFAULT_MEMBERS).map(m=>[m.name||'To be announced',m.role,m.cls,m.type,m.email,(m.jobs||[]).join('; '),m.bio])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');download(`nn-council-members-${new Date().toISOString().slice(0,10)}.csv`,csv,'text/csv');audit('export','members','CSV export')}
function downloadBackup(snapshot){download(`nn-council-backup-${snapshot.createdAt.slice(0,10)}.json`,JSON.stringify(snapshot,null,2));audit('backup.export','backup',snapshot.createdAt)}
function setup(){app.innerHTML='<main class="login"><div class="panel"><div class="brand"><span>NN</span>Student Council</div><h1>Create owner</h1><p>This one-time setup creates the first local owner account for this browser.</p><div class="warning">This static admin is suitable for private, low-risk deployments. GitHub Pages cannot provide server-side authentication or protect secrets from site visitors.</div><form id="setupForm"><div class="field"><label for="setupName">Your name</label><input id="setupName" required></div><div class="field"><label for="setupLogin">Username</label><input id="setupLogin" required autocomplete="username"></div><div class="field"><label for="setupPassword">Password</label><input id="setupPassword" type="password" required minlength="6" autocomplete="new-password"></div><div class="notice" id="setupNotice"></div><button class="btn primary" type="submit">Create owner account</button></form></div></main>';$("setupForm").onsubmit=async e=>{e.preventDefault();const users=[{id:uid(),name:$("setupName").value.trim(),login:$("setupLogin").value.trim().toLowerCase(),role:'owner',passwordHash:await hash($("setupPassword").value),createdAt:new Date().toISOString()}];if(!users[0].name||!users[0].login)return;write(KEY.users,users);if(!localStorage.getItem(KEY.members))write(KEY.members,DEFAULT_MEMBERS);sessionStorage.setItem(KEY.session,users[0].id);audit('setup','account','Owner account created');backup('Initial snapshot');renderAdmin()}}
function login(){app.innerHTML='<main class="login"><div class="panel"><div class="brand"><span>NN</span>Student Council</div><h1>Admin access</h1><p>Sign in to manage this browser\'s council directory.</p><form id="loginForm"><div class="field"><label for="login">Username</label><input id="login" required autocomplete="username"></div><div class="field"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"></div><div class="notice" id="loginNotice"></div><button class="btn primary" type="submit">Sign in</button></form></div></main>';$("loginForm").onsubmit=async e=>{e.preventDefault();const user=read(KEY.users,[]).find(u=>u.login===$("login").value.trim().toLowerCase());if(!user||user.passwordHash!==await hash($("password").value)){$("loginNotice").textContent='Incorrect username or password.';return}sessionStorage.setItem(KEY.session,user.id);audit('login','session');backup();renderAdmin()}}
function renderAdmin(){const u=currentUser();if(!u)return login();const tabs=[['members','Members','members.view'],['users','Users','users.manage'],['backups','Backups','backups.manage'],['audit','Audit log','audit.view']].filter(t=>can(t[2]));app.innerHTML=`<div class="shell"><header class="top"><div class="brand"><span>NN</span>Student Council <small style="color:var(--muted);font-weight:500">/ Admin</small></div><div class="top-actions"><span class="user-badge">${esc(u.name)} · ${esc(ROLES[u.role].label)}</span><button id="logout">Sign out</button></div></header><main><div class="intro"><div><div class="eyebrow">Static content management</div><h1>Admin dashboard</h1><p>Changes are saved to this browser's localStorage and are ready for static hosting.</p></div></div><div class="tabs">${tabs.map((t,i)=>`<button class="tab ${i===0?'active':''}" data-tab="${t[0]}">${t[1]}</button>`).join('')}</div><div id="view"></div></main></div>`;$("logout").onclick=()=>{audit('logout','session');sessionStorage.removeItem(KEY.session);login()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));renderView(b.dataset.tab)});renderView(tabs[0][0]);setInterval(()=>{backup()},10*60*1000)}
function renderView(tab){if(tab==='members')renderMembers();if(tab==='users')renderUsers();if(tab==='backups')renderBackups();if(tab==='audit')renderAudit()}
function renderMembers(){const members=read(KEY.members,DEFAULT_MEMBERS);$("view").innerHTML=`<section class="panel"><div class="toolbar"><div><h2>${members.length} council members</h2><span class="muted">The public page reads this same local dataset.</span></div><div class="toolbar-actions"><button class="btn" id="exportCSV">Export CSV</button><button class="btn" id="exportJSON">Export JSON</button>${can('members.edit')?'<button class="btn primary" id="add">+ Add member</button>':''}</div></div><div class="table-wrap"><table class="table"><thead><tr><th>Member</th><th>Class</th><th>Role</th><th>Actions</th></tr></thead><tbody>${members.map(m=>`<tr><td><span class="member-name">${esc(m.name||'To be announced')}</span><span class="member-meta">${esc(m.email||'No email')}</span></td><td>${esc(m.cls)}</td><td><span class="pill">${esc(m.role)}</span></td><td><div class="actions">${can('members.edit')?`<button class="btn small" data-edit="${esc(m.id)}">Edit</button>`:''}${can('members.delete')?`<button class="btn small danger" data-delete="${esc(m.id)}">Delete</button>`:''}</div></td></tr>`).join('')}</tbody></table></div></section>`;$("exportCSV").onclick=exportCSV;$("exportJSON").onclick=exportJSON;if($("add"))$("add").onclick=()=>openMember();document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openMember(members.find(m=>m.id===b.dataset.edit)));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteMember(b.dataset.delete))}
function openMember(m){$("editorTitle").textContent=m?'Edit member':'Add member';$("memberId").value=m?.id||'';$("name").value=m?.name||'';$("role").value=m?.role||'Class Representative';$("cls").value=m?.cls||'';$("type").value=m?.type||'representative';$("email").value=m?.email||'';$("jobs").value=(m?.jobs||[]).join(', ');$("bio").value=m?.bio||'';$("formNotice").textContent='';$("editor").classList.add('open');$("name").focus()}
$("cancel").onclick=()=>$("editor").classList.remove('open');$("memberForm").onsubmit=e=>{e.preventDefault();const id=$("memberId").value;const members=read(KEY.members,DEFAULT_MEMBERS);const record={id:id||uid(),name:$("name").value.trim(),role:$("role").value.trim(),cls:$("cls").value.trim().toUpperCase(),type:$("type").value,photo:null,email:$("email").value.trim(),jobs:$("jobs").value.split(',').map(x=>x.trim()).filter(Boolean),bio:$("bio").value.trim()};if(!record.cls.match(/^\d{1,2}[A-Z]$/)||!record.bio){$("formNotice").textContent='Enter a valid class such as 10A and an About description.';return}const i=members.findIndex(m=>m.id===id);if(i<0)members.push(record);else members[i]=record;write(KEY.members,members);audit(i<0?'member.create':'member.update','member',record.name||record.cls);backup('Member data changed');$("editor").classList.remove('open');renderMembers()};
function deleteMember(id){if(!confirm('Remove this member from the directory?'))return;const members=read(KEY.members,DEFAULT_MEMBERS),m=members.find(x=>x.id===id);write(KEY.members,members.filter(x=>x.id!==id));audit('member.delete','member',m?.name||id);backup('Member deleted');renderMembers()}
function renderUsers(){const users=read(KEY.users,[]);$("view").innerHTML=`<section class="panel"><div class="toolbar"><div><h2>${users.length} local user accounts</h2><span class="muted">Roles control which dashboard tabs and actions each user can access.</span></div><button class="btn primary" id="addUser">+ Add user</button></div><div class="table-wrap"><table class="table"><thead><tr><th>User</th><th>Username</th><th>Role</th><th>Actions</th></tr></thead><tbody>${users.map(u=>`<tr><td><span class="member-name">${esc(u.name)}</span></td><td>${esc(u.login)}</td><td><span class="pill">${esc(ROLES[u.role].label)}</span></td><td><div class="actions">${u.id!==currentUser().id?`<button class="btn small" data-user-edit="${esc(u.id)}">Edit</button><button class="btn small danger" data-user-delete="${esc(u.id)}">Delete</button>`:'<span class="muted">Current user</span>'}</div></td></tr>`).join('')}</tbody></table></div></section>`;$("addUser").onclick=()=>openUser();document.querySelectorAll('[data-user-edit]').forEach(b=>b.onclick=()=>openUser(users.find(u=>u.id===b.dataset.userEdit)));document.querySelectorAll('[data-user-delete]').forEach(b=>b.onclick=()=>deleteUser(b.dataset.userDelete))}
function openUser(u){$("userEditorTitle").textContent=u?'Edit user':'Add user';$("userId").value=u?.id||'';$("userName").value=u?.name||'';$("userLogin").value=u?.login||'';$("userRole").value=u?.role||'editor';$("userPassword").value='';$("userNotice").textContent='';$("userEditor").classList.add('open');$("userName").focus()}
$("userCancel").onclick=()=>$("userEditor").classList.remove('open');$("userForm").onsubmit=async e=>{e.preventDefault();const id=$("userId").value,users=read(KEY.users,[]),loginValue=$("userLogin").value.trim().toLowerCase(),existing=users.find(u=>u.login===loginValue&&u.id!==id);if(existing){$("userNotice").textContent='That username is already in use.';return}if(!id&&!$("userPassword").value){$("userNotice").textContent='A password is required for new users.';return}const i=users.findIndex(u=>u.id===id),record={id:id||uid(),name:$("userName").value.trim(),login:loginValue,role:$("userRole").value,createdAt:users[i]?.createdAt||new Date().toISOString(),passwordHash:users[i]?.passwordHash||await hash($("userPassword").value)};if($("userPassword").value)record.passwordHash=await hash($("userPassword").value);if(i<0)users.push(record);else users[i]=record;write(KEY.users,users);audit(i<0?'user.create':'user.update','user',record.login);backup('User access changed');$("userEditor").classList.remove('open');renderUsers()};
function deleteUser(id){if(!confirm('Delete this user account?'))return;const user=read(KEY.users,[]).find(u=>u.id===id);write(KEY.users,read(KEY.users,[]).filter(u=>u.id!==id));audit('user.delete','user',user?.login||id);backup('User deleted');renderUsers()}
function renderBackups(){const backups=read(KEY.backups,[]),last=backups[0];$("view").innerHTML=`<div class="stat-grid"><div class="stat"><strong>${backups.length}</strong><span>stored snapshots</span></div><div class="stat"><strong>${last?new Date(last.createdAt).toLocaleDateString():'—'}</strong><span>latest backup</span></div><div class="stat"><strong>30</strong><span>snapshot retention limit</span></div></div><section class="panel"><div class="toolbar"><div><h2>Backups & exports</h2><span class="muted">Automatic snapshots are created after changes and at most once every 24 hours.</span></div><div class="toolbar-actions"><button class="btn" id="manualBackup">Create snapshot</button><button class="btn primary" id="exportNow">Export current JSON</button></div></div>${backups.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Created</th><th>Reason</th><th>Records</th><th>Download</th></tr></thead><tbody>${backups.map((b,i)=>`<tr><td>${new Date(b.createdAt).toLocaleString()}</td><td>${esc(b.reason)}</td><td>${b.members.length} members</td><td><button class="btn small" data-backup="${i}">Download</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No snapshots yet.</div>'}</section>`;$("manualBackup").onclick=()=>{backup('Manual snapshot');audit('backup.create','backup','Manual snapshot');renderBackups()};$("exportNow").onclick=exportJSON;document.querySelectorAll('[data-backup]').forEach(b=>b.onclick=()=>downloadBackup(backups[+b.dataset.backup]))}
function renderAudit(){const logs=read(KEY.audit,[]);$("view").innerHTML=`<section class="panel"><div class="toolbar"><div><h2>Audit log</h2><span class="muted">The latest 500 local actions are retained.</span></div><button class="btn" id="exportAudit">Export log</button></div>${logs.length?`<div class="table-wrap"><table class="table"><thead><tr><th>When</th><th>Actor</th><th>Action</th><th>Target</th><th>Details</th></tr></thead><tbody>${logs.map(l=>`<tr><td>${new Date(l.at).toLocaleString()}</td><td>${esc(l.actor)}<span class="member-meta">${esc(l.actorRole)}</span></td><td><span class="log-action">${esc(l.action)}</span></td><td>${esc(l.target)}</td><td>${esc(l.detail)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No audit events yet.</div>'}</section>`;$("exportAudit").onclick=()=>download(`nn-council-audit-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(logs,null,2))}
if(!read(KEY.users,[]).length){setup()}else if(currentUser()){backup();renderAdmin()}else{login()}
</script>
</body></html>
